[project]
name = "cfc-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ninaedgley", email = "nina.edgley@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
cfc-python = "cfc_python:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
